name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # 如果你的主分支是 master，这里改成 master

permissions:
  contents: write # 赋予写入权限以发布页面

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # 如果你用 pnpm 或 yarn，可对应调整

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
